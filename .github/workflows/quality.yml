name: Quality checks

on:
  push:
    branches:
      - main
      - overhaul/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Report dependency lock updates
        run: |
          node -e "const fs=require('fs');const cp=require('child_process');const before=JSON.parse(cp.execFileSync('git',['show','HEAD:backend/package-lock.json'],{encoding:'utf8'}));const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));for(const [name,pkg] of Object.entries(after.packages)){if(before.packages[name]?.version!==pkg.version)console.log(name+': '+(before.packages[name]?.version||'absent')+' -> '+pkg.version)}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
