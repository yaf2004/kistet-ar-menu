name: Quality checks

on:
  push:
    branches:
      - main
      - overhaul/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Commit patched backend lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git -C "$GITHUB_WORKSPACE" add backend/package-lock.json
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
            git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" commit -m "security(deps): refresh backend lockfile"
            git -C "$GITHUB_WORKSPACE" fetch origin "$BRANCH_NAME"
            git -C "$GITHUB_WORKSPACE" rebase "origin/$BRANCH_NAME"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:$BRANCH_NAME"
          fi

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - run: npm audit fix --package-lock-only --legacy-peer-deps
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - name: Commit patched frontend lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git -C "$GITHUB_WORKSPACE" add frontend/package-lock.json
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
            git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" commit -m "security(deps): refresh frontend lockfile"
            git -C "$GITHUB_WORKSPACE" fetch origin "$BRANCH_NAME"
            git -C "$GITHUB_WORKSPACE" rebase "origin/$BRANCH_NAME"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:$BRANCH_NAME"
          fi
